<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FC7CE"/>
      <stop offset="1" stop-color="#2E7CF0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.30)"/>
      <stop offset="0.5" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- badan kaca -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#101722" opacity="0.94"/>
  <!-- kilau kaca -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#glass)"/>
  <!-- border gradien -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#g)" stroke-width="3"/>
  <!-- huruf V gradien dengan glow -->
  <path d="M19 21 L32 45 L45 21" fill="none" stroke="url(#g)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
