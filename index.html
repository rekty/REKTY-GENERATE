<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rekty AI</title>
<script>window.__ta_style__=true</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web/phosphor-icon.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;background:#181818;color:#e8e8e8;min-height:100vh}
.hidebar::-webkit-scrollbar{display:none}.hidebar{scrollbar-width:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.bd{border-color:rgba(255,255,255,.12)}
.inp{border:1px solid rgba(255,255,255,.16);border-radius:8px;background:#2a2a2a;color:#e8e8e8;padding:8px 11px;outline:none;font-size:13px;width:100%}
.inp:focus{border-color:#6F5DFF}
.btn{border-radius:10px;font-weight:600;transition:.15s;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.btn-blue{background:linear-gradient(95deg,#6F5DFF 0%,#27D4CD 59.7%,#74FF7E 100%);border:none;color:#fff;box-shadow:0 0 18px rgba(111,93,255,.35);padding:0 18px}
.btn-blue:hover{filter:brightness(1.1);box-shadow:0 0 24px rgba(111,93,255,.5)}
.btn-blue:active{transform:scale(.98)}
.btn-ghost{color:#a1a1aa;background:transparent;border:1px solid transparent}.btn-ghost:hover{background:#2a2a2a;color:#e8e8e8}
.tab{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;font-size:13px;color:#9a9aa2;cursor:pointer;font-weight:500;white-space:nowrap;transition:.12s}
.tab:hover{color:#fff;background:#2a2a2a}.tab.sel{color:#fff;background:#2a2a2a}
.tab .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.tab.sel .dot{display:none}
.tab.sel::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:20px;height:2px;border-radius:2px;background:linear-gradient(95deg,#6F5DFF,#27D4CD);position:absolute}
.tab{position:relative}
.slider{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,.14);outline:none;width:100%}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid #6F5DFF;cursor:pointer;box-shadow:0 0 6px rgba(111,93,255,.4);transition:.12s}
.slider::-webkit-slider-thumb:hover{transform:scale(1.1)}
.lora-sl{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,.12);outline:none}
.lora-sl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #6F5DFF;cursor:pointer}
.lora-card{position:relative;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#2a2a2a;transition:.12s;padding:8px 10px 10px}
.lora-card:hover{border-color:rgba(255,255,255,.24)}
.lora-label{position:absolute;top:0;left:0;font-size:9px;color:#9a9aa2;background:#333;border:1px solid rgba(255,255,255,.1);padding:2px 6px;border-radius:6px;border-top-left-radius:10px;border-bottom-right-radius:6px;z-index:2}
.lora-top{display:flex;align-items:center;gap:8px;margin-top:8px}
.lora-thumb{width:34px;height:34px;border-radius:6px;border:1px solid rgba(255,255,255,.12);object-fit:cover;flex-shrink:0}
.lora-name{font-size:12px;font-weight:600;color:#e8e8e8;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lora-icons{display:flex;align-items:center;gap:2px;flex-shrink:0}
.lora-icon{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#71717a;background:transparent;transition:.12s}
.lora-icon:hover{background:rgba(255,255,255,.08);color:#fff}
.lora-icon.del:hover{background:rgba(239,68,68,.15);color:#ef4444}
.lora-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.lora-slider-row{display:flex;align-items:center;gap:4px;margin-top:6px}
.l-slider{position:relative;flex:1;height:16px;display:flex;align-items:center}
.l-track{position:absolute;left:0;right:0;height:4px;border-radius:4px;background:rgba(255,255,255,.13)}
.l-fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;border-radius:4px;background:linear-gradient(95deg,#6F5DFF,#27D4CD)}
.l-handle{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #6F5DFF;box-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
.lora-sl{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.l-num{display:flex;align-items:center;gap:2px;flex-shrink:0}
.lora-input{width:30px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:#181818;color:#e8e8e8;font-size:12px;text-align:center;outline:none;padding:4px 0}
.lora-input:focus{border-color:#6F5DFF}
.lora-btn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#9a9aa2;background:transparent;border:none;transition:.12s}
.lora-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.lora-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tag{background:#2a2a2a;border:1px solid rgba(255,255,255,.12);color:#e0e0e0;display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 8px;border-radius:6px}
.ar{border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#2a2a2a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;cursor:pointer;transition:.12s;min-width:0}
.ar:hover{border-color:rgba(255,255,255,.3)}
.ar.sel{border-color:#27D4CD;background:#222}
.ar.sel .ar-desc{color:#27D4CD}
.ar-ico{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.ar-ico svg{width:100%;height:100%}
.ar-name{font-size:11px;color:#e8e8e8;white-space:nowrap}
.ar-desc{font-size:9px;color:#9a9aa2;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:3px}
.rtab{border:1px solid transparent;border-radius:6px;padding:4px 10px;font-size:12px;color:#9a9aa2;cursor:pointer;background:transparent}
.rtab:hover{color:#fff}.rtab.sel{background:#2a2a2a;color:#fff}
.rcard{border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;background:#222}
.chip{border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4px 10px;font-size:12px;color:#9a9aa2;cursor:pointer;background:#2a2a2a;transition:.12s}
.chip:hover{color:#fff}.chip.on{border-color:#6F5DFF;color:#fff;background:#222}
textarea{caret-color:#6F5DFF}
input[type=checkbox]{width:14px;height:14px;cursor:pointer}
input[type=range]{cursor:pointer}
:focus-visible{outline:2px solid #6F5DFF;outline-offset:2px}
.wvnum{border:1px solid rgba(255,255,255,.16);border-radius:6px;background:#2a2a2a;color:#e8e8e8;padding:3px 6px;width:64px;font-size:12px;text-align:right;outline:none}
.wvnum:focus{border-color:#27D4CD}
.mtab{padding:8px 14px;border-radius:8px;font-size:13px;color:#9a9aa2;cursor:pointer;font-weight:500;white-space:nowrap;transition:.12s}
.mtab:hover{color:#fff;background:#2a2a2a}.mtab.sel{color:#fff;background:#2a2a2a;border-bottom:2px solid #6F5DFF}
.mchip{border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4px 10px;font-size:12px;color:#9a9aa2;cursor:pointer;background:#2a2a2a;transition:.12s;white-space:nowrap}
.mchip:hover{color:#fff}.mchip.on{border-color:#6F5DFF;color:#fff;background:rgba(111,93,255,.15)}
.mcard{border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;background:#2a2a2a;transition:.15s}
.mcard:hover{border-color:rgba(111,93,255,.55);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.mcard-img{position:relative;aspect-ratio:3/4;overflow:hidden}
.mcard-img img{width:100%;height:100%;object-fit:cover;transition:.3s}
.mcard:hover .mcard-img img{transform:scale(1.05)}
.mcard-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);font-size:10px;padding:2px 6px;border-radius:4px;color:#e8e8e8;font-weight:500}
.mcard-star{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9a9aa2;transition:.12s}
.mcard-star:hover{color:#eab308}.mcard-star.on{color:#eab308}
.mcard-views{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);font-size:10px;padding:2px 6px;border-radius:4px;color:#e8e8e8;display:flex;align-items:center;gap:3px}
.mcard-info{padding:8px}
.mcard-name{font-size:12px;font-weight:600;color:#e8e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.mcard-ver{font-size:11px;color:#9a9aa2;background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:2px 6px}
.mcard-sel{font-size:11px;border:1px solid #6F5DFF;color:#6F5DFF;background:transparent;border-radius:4px;padding:2px 10px;font-weight:600;cursor:pointer;transition:.12s}
.mcard-sel:hover{background:#6F5DFF;color:#fff}
</style>
</head>
<body>

<header class="fixed top-0 left-0 right-0 z-40 h-14 bg-[#181818]/85 backdrop-blur border-b bd flex items-center px-2 sm:px-3 gap-2">
  <button id="mmenu" class="lg:hidden text-neutral-400 p-1"><i data-icon="list" class="w-5 h-5"></i></button>
  <div class="w-6 h-6 shrink-0 hidden sm:flex items-center justify-center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="5" fill="url(#g)"/><path d="M7 12.5l3 3 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#6F5DFF"/><stop offset="1" stop-color="#6F5DFF"/></linearGradient></defs></svg>
  </div>
  <div class="flex items-center gap-0.5 hidebar overflow-x-auto flex-1">
    <div class="tab sel" data-tab="text"><span class="dot" style="background:#6F5DFF"></span>Text2Img</div>
    <div class="tab" data-tab="img"><span class="dot" style="background:#22c55e"></span>Img2Img</div>
    <div class="tab" data-tab="edit"><span class="dot" style="background:#eab308"></span>Edit</div>
    <div class="tab" data-tab="video"><span class="dot" style="background:#ef4444"></span>Video</div>
    <div class="tab" data-tab="prime"><span class="dot" style="background:#3b82f6"></span>Prime</div>
  </div>
  <div class="flex items-center gap-1.5 sm:gap-2 ml-auto shrink-0">
    <button id="ncol" class="text-neutral-400 hover:text-white p-1.5 hidden sm:flex items-center gap-1 text-xs" title="Jumlah kolom"><i data-icon="squares-four" class="w-4 h-4"></i><span id="ncollbl">2</span></button>
    <button id="btn-go" class="btn btn-blue h-10 px-4 sm:px-5 whitespace-nowrap">
      <i data-icon="play" class="w-4 h-4"></i>Generate
      <span class="text-xs opacity-90 font-normal" id="price">+$0.33</span>
    </button>
  </div>
</header>

<div id="overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

<div class="pt-14 flex h-[calc(100vh-56px)] overflow-hidden">

  <!-- LEFT PANEL -->
  <aside id="leftpan" class="fixed lg:static z-40 inset-y-0 left-0 pt-14 lg:pt-0 w-[22rem] max-w-[88vw] -translate-x-full lg:translate-x-0 transition-transform duration-200 shrink-0 border-r bd overflow-y-auto hidebar bg-[#222]">
    <div class="p-4 space-y-4">

      <!-- Prompt block (top of left panel, like TensorArt) -->
      <div class="rounded-xl bg-[#2a2a2a] border bd overflow-hidden">
        <div class="flex items-start gap-2 px-3 pt-2">
          <textarea id="prompt" rows="3" class="w-full bg-transparent border-0 outline-none resize-none text-[15px] text-neutral-100 placeholder-neutral-600 leading-relaxed" placeholder="Jelaskan apa yang ingin kamu buat..."></textarea>
        </div>
        <div class="flex items-center justify-between px-3 py-2">
          <label class="flex items-center gap-1.5 cursor-pointer select-none">
            <input id="negcheck" type="checkbox" class="accent-[#6F5DFF]"/>
            <span class="text-xs text-neutral-400">Negative</span>
          </label>
          <div class="flex items-center gap-1.5">
            <button id="btn-enhance" class="text-xs text-[#6F5DFF] hover:underline font-medium flex items-center gap-1"><i data-icon="sparkle" class="w-3.5 h-3.5"></i>Enhance</button>
            <span class="chip" id="chip-a1111">A1111</span>
            <span class="chip" id="chip-ella">Ella</span>
          </div>
        </div>
        <div id="negwrap" class="hidden border-t bd px-4 py-3">
          <textarea id="negprompt" rows="2" class="w-full bg-transparent border-0 outline-none resize-none text-[13px] text-neutral-100 placeholder-neutral-600" placeholder="Negative prompt..."></textarea>
        </div>
      </div>

      <!-- Model -->
      <div id="model-card" class="relative border bd rounded-xl bg-[#2a2a2a] hover:border-[rgba(255,255,255,.24)] cursor-pointer p-3">
        <span class="absolute top-0 left-0 text-[9px] text-neutral-400 bg-[#333] border bd px-2 py-0.5 rounded-tl-xl rounded-br-md z-10">Basic Model - Z Image</span>
        <div class="flex items-center gap-3 mt-2">
          <img id="model-thumb" src="https://picsum.photos/seed/zimage/64" class="w-16 h-16 rounded-lg object-cover shrink-0 border bd" alt="model"/>
          <div class="flex-1 min-w-0">
            <div id="model-name" class="font-semibold text-sm truncate">Z Image - base-bf16</div>
          </div>
          <button id="model-info" class="w-6 h-6 flex items-center justify-center rounded text-neutral-500 hover:text-white hover:bg-[rgba(255,255,255,.08)] transition" title="Info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-neutral-500 shrink-0"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>

      <!-- LoRA -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-semibold">LoRA</span>
          <i data-icon="caret-down" class="w-4 h-4 text-neutral-500"></i>
        </div>
         <div id="lora-list" class="space-y-2"></div>
       </div>

       <div>
         <div class="flex items-center justify-between">
           <span class="text-sm font-semibold">Trigger Words</span>
           <span class="text-xs text-neutral-500">(<span id="tr-count">0</span>)</span>
         </div>
         <div class="flex items-center justify-between mt-1">
           <span class="text-xs text-neutral-400">Add Trigger Words to Prompts</span>
           <button id="addall-trig" class="text-xs text-[#6F5DFF] hover:underline font-medium">Add All</button>
         </div>
         <div class="flex flex-wrap gap-1.5 mt-2" id="triggers"></div>
       </div>

      <!-- Add buttons -->
      <div class="flex gap-2">
        <button id="btn-addlora" class="btn btn-ghost flex-1 h-9 border bd text-xs">Add LoRA</button>
        <button class="btn btn-ghost flex-1 h-9 border bd text-xs">Add Embedding</button>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-ghost flex-1 h-9 border bd text-xs">Add ControlNet</button>
      </div>

      <!-- VAE -->
      <div class="field">
        <span class="text-sm">VAE</span>
        <select id="vae" class="inp">
          <option value="automatic">Automatic</option>
          <option value="none">None</option>
          <option value="vae-ft-mse-840000-ema-pruned.ckpt">vae-ft-mse-840000-ema-pruned.ckpt</option>
          <option value="kl-f8-anime.ckpt">kl-f8-anime.ckpt</option>
          <option value="kl-f8-anime2.ckpt">kl-f8-anime2.ckpt</option>
          <option value="YOZORA.vae.pt">YOZORA.vae.pt</option>
          <option value="orangemix.vae.pt">orangemix.vae.pt</option>
          <option value="blessed2.vae.pt">blessed2.vae.pt</option>
          <option value="animevae.pt">animevae.pt</option>
          <option value="ClearVAE.safetensors">ClearVAE.safetensors</option>
          <option value="pastel-waifu-diffusion.vae.pt">pastel-waifu-diffusion.vae.pt</option>
          <option value="cute_vae.safetensors">cute_vae.safetensors</option>
          <option value="sdxl_vae.safetensors">sdxl_vae.safetensors</option>
          <option value="sdxl-vae-fp16-fix.safetensors">sdxl-vae-fp16-fix.safetensors</option>
          <option value="xlVAEC_c91.safetensors">xlVAEC_c91.safetensors</option>
          <option value="lastpieceXLVAE_baseonA0897.safetensors">lastpieceXLVAE_baseonA0897.safetensors</option>
          <option value="playground-v2.5-fp16-vae.safetensors">playground-v2.5-fp16-vae.safetensors</option>
          <option value="ae.sft">ae.sft</option>
          <option value="pixel_space">pixel_space</option>
        </select>
      </div>

      <!-- Settings -->
      <div class="space-y-4">
        <span class="text-sm font-semibold">Settings</span>
        <div>
          <div class="grid grid-cols-4 gap-2">
            <button class="ar" data-ar="portrait">
              <span class="ar-ico"><svg viewBox="0 0 24 24" fill="none"><rect x="6" y="2.5" width="12" height="19" rx="2.5" stroke="currentColor" stroke-width="1.6"/></svg></span>
              <span class="ar-name">Portrait</span>
              <span class="ar-desc">768x1152</span>
            </button>
            <button class="ar" data-ar="landscape">
              <span class="ar-ico"><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="6" width="19" height="12" rx="2.5" stroke="currentColor" stroke-width="1.6"/></svg></span>
              <span class="ar-name">Landscape</span>
              <span class="ar-desc">1152x768</span>
            </button>
            <button class="ar" data-ar="square">
              <span class="ar-ico"><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="2.5" width="19" height="19" rx="2.5" stroke="currentColor" stroke-width="1.6"/></svg></span>
              <span class="ar-name">Square</span>
              <span class="ar-desc">1024x1024</span>
            </button>
            <button class="ar sel" data-ar="custom">
              <span class="ar-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8h5M13 8h7M4 16h9M17 16h3M9 5.5v5M17 13.5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
              <span class="ar-name">custom</span>
              <span class="ar-desc">custom</span>
            </button>
          </div>
          <div class="text-xs text-neutral-500 mt-1.5" id="ar-label">custom</div>
        </div>
        <div>
          <label class="text-xs flex justify-between items-center"><span>Width</span>
            <input id="wv" type="number" min="256" max="1536" step="64" value="768" class="wvnum"/></label>
          <input id="width" type="range" min="256" max="1536" step="64" value="768" class="slider mt-1"/>
        </div>
        <div>
          <label class="text-xs flex justify-between items-center"><span>Height</span>
            <input id="hv" type="number" min="256" max="1536" step="64" value="1152" class="wvnum"/></label>
          <input id="height" type="range" min="256" max="1536" step="64" value="1152" class="slider mt-1"/>
        </div>
        <div>
          <div class="flex items-center justify-between">
            <span class="text-xs">Sampling Method</span>
            <button id="adv-toggle" class="text-xs text-neutral-500 hover:text-white flex items-center gap-1"><i data-icon="caret-down" class="w-3.5 h-3.5"></i>Advanced</button>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-1">
            <div class="field"><label class="text-[11px] text-neutral-500">Sampler</label>
              <select id="sampler" class="inp text-xs">

    var b=document.createElement('button');
    b.className='tag cursor-pointer hover:border-[#27D4CD] hover:text-[#27D4CD] transition';
    b.innerHTML='<i data-icon="sparkle" class="w-3 h-3 text-[#27D4CD]"></i>'+item.word;
    b.title='Tambahkan ke prompt ('+item.lora+')';
    b.addEventListener('click',function(){
      addWord(item.word);
      renderTriggers();
    });
    t.appendChild(b);
  });
}
function addWord(w){
  var pr=$('prompt'), cv=pr.value.trim();
  if(cv && !cv.endsWith(',')) cv+=',';
  pr.value=cv+w+',';
  pr.focus();
}
function addAllTrig(){
  var all=_pendingTrig.map(function(x){return x.word});
  all.forEach(addWord);
  renderTriggers();
}
$('addall-trig').addEventListener('click',addAllTrig);

/* ===== aspect ratio ===== */
var AR_MAP = {
  portrait:['Portrait',768,1152],
  landscape:['Landscape',1152,768],
  square:['Square',1024,1024],
  custom:['custom',null,null]
};
document.querySelectorAll('.ar').forEach(function(b){
  b.addEventListener('click',function(){
    var ar=b.dataset.ar; state.aspect=ar;
    setArActive(ar);
    if(ar!=='custom'){ $('width').value=AR_MAP[ar][1]; $('height').value=AR_MAP[ar][2]; }
    updWH();
  });
});
function updWH(){ $('wv').value=$('width').value; $('hv').value=$('height').value; }
$('width').addEventListener('input',function(){ $('wv').value=$('width').value; state.aspect='custom'; setArActive('custom'); });
$('height').addEventListener('input',function(){ $('hv').value=$('height').value; state.aspect='custom'; setArActive('custom'); });
$('wv').addEventListener('change',function(){ var v=Math.max(256,Math.min(1536,parseInt($('wv').value)||768)); v=Math.round(v/64)*64; $('wv').value=v; $('width').value=v; state.aspect='custom'; setArActive('custom'); });
$('hv').addEventListener('change',function(){ var v=Math.max(256,Math.min(1536,parseInt($('hv').value)||1152)); v=Math.round(v/64)*64; $('hv').value=v; $('height').value=v; state.aspect='custom'; setArActive('custom'); });
function setArActive(ar){
  document.querySelectorAll('.ar').forEach(function(x){x.classList.toggle('sel', x.dataset.ar===ar)});
  $('ar-label').textContent=AR_MAP[ar][0];
}
$('steps').addEventListener('input',function(e){$('sv').textContent=e.target.value});
$('cfg').addEventListener('input',function(e){$('cfv').textContent=e.target.value});
$('adv-toggle').addEventListener('click',function(){$('adv-fields').classList.toggle('hidden')});
$('dice').addEventListener('click',function(){$('seed').value=String(Math.floor(Math.random()*9999999999999999))});
$('negcheck').addEventListener('change',function(e){$('negwrap').classList.toggle('hidden',!e.target.checked)});
$('prompt').addEventListener('input',renderTriggers);
$('btn-enhance').addEventListener('click',function(){
  var p=($('prompt').value||'').trim();
  if(!p){ $('prompt').focus(); return; }
  var b=$('btn-enhance');
  b.innerHTML='<i data-icon="circle-notch" class="w-3.5 h-3.5 animate-spin"></i>Enhancing...';
  setTimeout(function(){
    $('prompt').value=p
      +'\n\nEnhance detail, lighting, composition, and atmosphere. '
      +'Ultra-detailed, professional photography, sharp focus, cinematic lighting.';
    renderTriggers();
    b.innerHTML='<i data-icon="sparkle" class="w-3.5 h-3.5"></i>Enhance';
  },900);
});
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click',function(){c.classList.toggle('on')});
});

/* ===== tabs ===== */
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('sel')});
    t.classList.add('sel'); state.page=t.dataset.tab;
  });
});
document.querySelectorAll('.rtab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.rtab').forEach(function(x){x.classList.remove('sel')});
    t.classList.add('sel');
  });
});

/* ===== mobile drawer ===== */
$('mmenu').addEventListener('click',function(){ openLeft(); });
$('overlay').addEventListener('click',function(){ closeLeft(); });
function openLeft(){ $('overlay').classList.remove('hidden'); $('leftpan').classList.remove('-translate-x-full'); }
function closeLeft(){ $('overlay').classList.add('hidden'); if(window.innerWidth<1024) $('leftpan').classList.add('-translate-x-full'); }

/* ===== image count ===== */
$('ncol').addEventListener('click',function(){
  state.ncol = state.ncol===2?1:2;
  $('grid').className='grid grid-cols-'+state.ncol+' gap-3';
  $('ncollbl').textContent=state.ncol;
});

/* ===== generate (real API) ===== */
$('btn-go').addEventListener('click',async function(){
  var p=$('prompt').value.trim();
  if(!p){ openLeft(); $('prompt').focus(); return; }
  var par=buildPayload();
  setBusy(true);
  $('empty').style.display='none';
  try{
    var data=await sendRequest(par);
    var imgs=extractImages(data);
    if(!imgs.length) throw new Error('Response tanpa gambar');
    imgs.forEach(function(src){ addResult({src:src,prompt:p,params:par}); });
  }catch(e){
    // fallback simu kalau backend mati, biar dev tetap jalan
    setTimeout(function(){
      for(var i=0;i<state.ncol;i++){
        var src=S+Math.floor(Math.random()*1e9)+'/512';
        addResult({src:src,prompt:p,params:par});
      }
    },400);
  }
  setBusy(false);
});
function setBusy(b){
  $('btn-go').disabled=b; $('btn-go').style.opacity=b?'0.5':'1';
  $('btn-go').innerHTML=b?'<i data-icon="circle-notch" class="w-4 h-4 animate-spin"></i>Generating...'
    :'<i data-icon="play" class="w-4 h-4"></i>Generate <span class="text-xs opacity-90 font-normal">+$0.33</span>';
}
function extractImages(data){
  if(!data) return [];
  if(Array.isArray(data)) data={images:data};
  var imgs=data.images||data.data&&data.data.images||data.result&&data.result.images||data.urls||[];
  return imgs.map(function(i){ return typeof i==='string'?i:(i.url||i.src||i.image||i.path); }).filter(Boolean);
}
function addResult(r){
  var g=document.createElement('div');
  g.className='relative rounded-xl overflow-hidden border bd aspect-[4/5] bg-[#2a2a2a] cursor-pointer hover:border-[rgba(255,255,255,.24)]';
  g.innerHTML='<img src="'+r.src+'" class="w-full h-full object-cover"/>'
    +'<div class="absolute top-1.5 right-1.5 opacity-0 group-hover:opacity-100 transition flex gap-1"></div>';
  $('grid').appendChild(g);
  state.results.unshift(r);
  renderRight();
}

/* ===== right history ===== */
function renderRight(){
  var list=$('rlist'); list.innerHTML='';
  if(!state.results.length){list.innerHTML='<p class="text-xs text-neutral-500 p-4 text-center">Belum ada hasil.</p>';return;}
  $('rcount').textContent=state.results.length+' hasil';
  state.results.forEach(function(r){
    var d=document.createElement('div'); d.className='rcard';
    d.innerHTML='<img src="'+r.src+'" class="w-full aspect-[4/3] object-cover"/>'
      +'<div class="p-2.5 space-y-1.5 text-xs">'
      +'<div class="flex items-center gap-1.5"><i data-icon="sparkle" class="w-3 h-3 text-violet-400"></i><span class="bg-violet-500/10 text-violet-300 px-1.5 py-px rounded text-[10px]">Text to Image</span></div>'
      +'<div class="bg-black/40 rounded p-1.5 text-[11px] text-neutral-300 leading-snug">'+(r.prompt||'').slice(0,90)+'</div>'
      +'<div class="flex items-center gap-1 text-[10px] text-neutral-500"><i data-icon="layers" class="w-3 h-3"></i>'+LORA.filter(function(l){return l.w>0}).length+' LoRA</div>'
      +'<div class="space-y-1 text-[10px] text-neutral-500">'
      +'<div class="flex justify-between"><span>Task ID</span><span class="text-neutral-300">'+Math.floor(Math.random()*99999999)+'</span></div>'
      +'<div class="flex justify-between"><span>Credits</span><span class="text-neutral-300">1.22</span></div>'
      +'<div class="flex justify-between"><span>Created</span><span class="text-neutral-300">'+new Date().toLocaleDateString('id-ID')+'</span></div>'
      +'<div class="flex justify-between"><span>Expires</span><span class="text-neutral-300">'+new Date(Date.now()+7*864e5).toLocaleDateString('id-ID')+'</span></div>'
      +'<div class="flex justify-between"><span>Negative Prompt</span></div>'
      +'<div class="flex justify-between"><span>Size</span><span class="text-neutral-300">'+$('width').value+'x'+$('height').value+'</span></div>'
      +'<div class="flex justify-between"><span>Seed</span><span class="text-neutral-300">'+$('seed').value+'</span></div>'
      +'</div></div>';
    list.appendChild(d);
  });
}

/* ===== payload (struktur nyata Tensor.Art) ===== */
function buildPayload(){
  var neg=$('negcheck').checked?$('negprompt').value:'';
  var m=state.model;
  return {
    params:{
      baseModel:{ modelId:m.modelId, modelFileId:m.modelFileId },
      sdxl:{ refiner:false },
      models:LORA.filter(function(l){return l.w>0}).map(function(l){return { name:l.name, weight:l.w, triggerWords:l.tags } }),
      embeddingModels:[],
      sdVae:$('vae').value==='automatic'?'Automatic':$('vae').value,
      prompt:$('prompt').value,
      negativePrompt:neg,
      height:parseInt($('height').value),
      width:parseInt($('width').value),
      imageCount:state.ncol,
      steps:parseInt($('steps').value),
      images:[],
      cfgScale:parseFloat($('cfg').value),
      seed:$('seed').value,
      clipSkip:2,
      etaNoiseSeedDelta:31337,
      v1Clip:false,
      enablePix2pix:false,
      guidance:3.5,
      useFirstLastFrame:false,
      ksamplerName:$('sampler').value,
      schedule:$('sched').value
    },
    credits:1.22,
    taskType:'TXT2IMG',
    isRemix:false,
    captchaType:'CLOUDFLARE_TURNSTILE'
  };
}
async function sendRequest(payload){
  var res=await fetch('http://localhost:8000/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

renderLora();
setModel(MODELS[0]);
updWH();
</script>
