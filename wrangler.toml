# Konfigurasi Cloudflare Pages (Advanced Mode _worker.js).
# Sumber kebenaran config project Pages `rekty-generator`:
#   - binding IMAGES -> KV namespace rekty-generator-REKTY_IMAGES
#     (arsip gambar permanen; gratis tanpa kartu kredit — R2 butuh billing)
# Deploy: node scripts/build_worker.mjs && npx wrangler@3.90.0 pages deploy .
name = "rekty-generator"
pages_build_output_dir = "."
compatibility_date = "2024-09-01"

[[kv_namespaces]]
binding = "IMAGES"
id = "67db99d326cc4995995a301814afde8e"

# Cloudflare Queues: producer antrian generate Pollinations.
# (Consumer = worker terpisah `rekty-generate-consumer`, lihat consumer/.)
[[queues.producers]]
binding = "REKTY_QUEUE"
queue = "rekty-generate"
